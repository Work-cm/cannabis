<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none">
  <defs>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#b4551b"/>
    </linearGradient>
  </defs>

  <!-- Capsule mark (a "lap" track loop) -->
  <rect x="2" y="10" width="60" height="28" rx="14" fill="url(#pillGrad)"/>
  <rect x="6" y="14" width="52" height="20" rx="10" stroke="#fdf4ea" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>

  <!-- Center dot -->
  <circle cx="32" cy="24" r="7" fill="#fdf4ea" />

  <!-- Wordmark -->
  <text x="72" y="30" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#a3470d" letter-spacing="-0.02em">Cannabis<tspan fill="#ff9d2e">Lap</tspan></text>
  <text x="73" y="41" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="700" fill="#b4551b" letter-spacing="0.28em">PREMIUM CRAFT FLOWER · WORLDWIDE</text>
</svg>


